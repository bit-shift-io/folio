[package]
name = "folio"
version = "0.1.0"
edition = "2021"
description = "Fast, single-binary local web file explorer"
license = "MIT"

[[bin]]
name = "folio"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "sync", "time"] }
axum = { version = "0.8", default-features = false, features = ["ws", "tokio", "http1", "json", "query"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
notify = "8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
tower-http = { version = "0.6", features = ["cors"] }

[dev-dependencies]
futures-util = "0.3"
tower = { version = "0.5", features = ["util"] }
tempfile = "3"
tokio-tungstenite = "0.29"

[profile.dev]
# No debuginfo in dev builds: the largest wall-clock win available and folio
# is not usually debugged. Delete these two lines to get line numbers in
# debugger backtraces back.
debug = 0

[profile.release]
opt-level = 3